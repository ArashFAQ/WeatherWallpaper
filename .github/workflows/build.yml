name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease -PversionCode=${{ github.run_number }} --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WeatherWallpaper-${{ github.run_number }}
          path: app.apk

      - name: Publish as latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app.apk --title "نسخه ${{ github.run_number }}" --notes "ساخته‌شده از ${{ github.sha }}" --latest
